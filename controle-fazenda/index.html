<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle da Fazenda</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#23301f;--mut:#6b7566;--line:#e2ddd0;--pri:#3d6b35;--pri2:#2e5128;--red:#b3402f;--amb:#b7791f;--blue:#2b6a8f}
@media (prefers-color-scheme:dark){:root{--bg:#171b15;--card:#212720;--ink:#e8ecdf;--mut:#9aa593;--line:#343c31;--pri:#6fae63;--pri2:#2e5128;--red:#e0745f;--amb:#e0a84a;--blue:#6bb0d6}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--pri2);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
header h1{margin:0;font-size:18px}
header .tools button{background:rgba(255,255,255,.15);color:#fff;border:0;padding:6px 10px;border-radius:6px;margin-left:4px;cursor:pointer;font-size:13px}
nav{display:flex;gap:2px;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:0;z-index:5}
nav button{flex:1;min-width:110px;padding:12px 8px;border:0;background:none;color:var(--mut);font-weight:600;cursor:pointer;border-bottom:3px solid transparent;font-size:14px}
nav button.on{color:var(--pri);border-color:var(--pri)}
main{max-width:1000px;margin:0 auto;padding:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px}
.grid .card{margin:0}
.k{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.v{font-size:24px;font-weight:700;margin-top:2px}
.pos{color:var(--pri)}.neg{color:var(--red)}
h2{font-size:16px;margin:0 0 10px}
form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
input,select,textarea{font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
.btn{background:var(--pri);color:#fff;border:0;border-radius:6px;padding:9px 14px;cursor:pointer;font:inherit;font-weight:600}
.btn.sec{background:none;color:var(--pri);border:1px solid var(--pri)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.del{background:none;color:var(--red);border:1px solid var(--red)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--mut);font-size:12px;text-transform:uppercase}
td.n,th.n{text-align:right}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--pri)}
.bar i.over{background:var(--red)}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--line)}
.tag.venda,.tag.receita{color:var(--pri)}.tag.compra,.tag.despesa,.tag.morte{color:var(--red)}.tag.nascimento{color:var(--blue)}
.obra{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px;background:var(--card)}
.obra-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.obra-h b{font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hide{display:none}
.err{color:var(--red);font-size:13px;min-height:1em;margin-top:6px}
.empty{color:var(--mut);padding:10px 0}
.hint{color:var(--mut);font-size:13px;margin:0 0 10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}.modal>div{background:var(--card);border-radius:10px;padding:18px;max-width:420px;width:100%}.modal p{margin:0 0 14px}.modal .row{justify-content:flex-end}.modal.hide{display:none}
</style>
</head>
<body>
<header>
  <h1>🐂 Controle da Fazenda</h1>
  <div class="tools">
    <button onclick="exportar()">Salvar backup</button>
    <button onclick="document.getElementById('imp').click()">Restaurar</button>
    <input id="imp" type="file" accept=".json" class="hide" onchange="importar(event)">
  </div>
</header>
<nav id="nav"></nav>
<main id="app"></main>
<div id="modal" class="modal hide"><div><p id="mmsg"></p><div class="row"><button class="btn sec" id="mno">Cancelar</button><button class="btn" id="myes">OK</button></div></div></div>

<script>
const KEY='fazenda_v1';
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const hoje=()=>new Date().toISOString().slice(0,10);
const brl=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=n=>(Number(n)||0).toLocaleString('pt-BR');
const dt=s=>s?s.split('-').reverse().join('/'):'';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATS_REC=['Venda de gado','Leite','Arrendamento','Outras receitas'];
const CATS_DESP=['Compra de gado','Sanidade/Vacinas','Ração/Sal mineral','Combustível','Mão de obra','Energia','Impostos','Manutenção','Outras despesas'];

let S=load();
let tab='resumo';
let filtroObra=null;

function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.cats)return s}catch(e){}
  return {cats:[
    {id:uid(),nome:'Bois',qtd:0,valor:0},
    {id:uid(),nome:'Vacas',qtd:0,valor:0},
    {id:uid(),nome:'Novilhas',qtd:0,valor:0},
    {id:uid(),nome:'Bezerros',qtd:0,valor:0},
    {id:uid(),nome:'Touros',qtd:0,valor:0}],
    movs:[],lancs:[],obras:[],custos:[]};
}
function ask(msg,info){return new Promise(res=>{$('#mmsg').textContent=msg;$('#mno').classList.toggle('hide',!!info);$('#modal').classList.remove('hide');
  const f=v=>{$('#modal').classList.add('hide');res(v)};$('#myes').onclick=()=>f(true);$('#mno').onclick=()=>f(false)})}
const say=m=>ask(m,true);
let DB=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(DB)DB.set(JSON.parse(JSON.stringify(S))).catch(()=>{})}
async function initDb(){
  try{const c=window.claude&&await window.claude.use('db');if(!c)return;
    const ref=c.doc('fazenda/estado');let first=true;
    ref.onSnapshot(snap=>{
      if(snap.exists){const d=JSON.parse(JSON.stringify(snap.data()));if(d.cats){S=d;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render()}}
      else if(first){DB=ref;if(S.movs.length||S.lancs.length||S.obras.length||S.cats.some(c=>c.qtd))save()}
      if(first){DB=ref;first=false}
    },()=>{});
  }catch(e){}}
function commit(){save();render()}

/* ---------- cálculos ---------- */
const totalCabecas=()=>S.cats.reduce((a,c)=>a+c.qtd,0);
const valorRebanho=()=>S.cats.reduce((a,c)=>a+c.qtd*c.valor,0);
const somaLanc=t=>S.lancs.filter(l=>l.tipo===t).reduce((a,l)=>a+l.valor,0);
const gastoObra=id=>S.custos.filter(c=>c.obraId===id).reduce((a,c)=>a+c.valor,0);
const totalObras=()=>S.custos.reduce((a,c)=>a+c.valor,0);
const orcTotal=()=>S.obras.reduce((a,o)=>a+o.orcamento,0);
const catNome=id=>(S.cats.find(c=>c.id===id)||{nome:'(removida)'}).nome;

/* ---------- navegação ---------- */
const TABS=[['resumo','Resumo'],['rebanho','Rebanho'],['fin','Financeiro'],['obras','Benfeitorias']];
function render(){
  $('#nav').innerHTML=TABS.map(([k,n])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()">${n}</button>`).join('');
  $('#app').innerHTML={resumo:vResumo,rebanho:vRebanho,fin:vFin,obras:vObras}[tab]();
}

/* ---------- RESUMO ---------- */
function vResumo(){
  const rec=somaLanc('receita'),desp=somaLanc('despesa'),obras=totalObras();
  const saldo=rec-desp-obras;
  const rows=S.cats.map(c=>`<tr><td>${esc(c.nome)}</td><td class="n"><input style="width:90px;text-align:right" type="number" min="0" step="1" value="${c.qtd}" onchange="setQtd('${c.id}',this.value)"></td><td class="n">${brl(c.valor)}</td><td class="n">${brl(c.qtd*c.valor)}</td></tr>`).join('');
  return `<div class="grid">
    <div class="card"><div class="k">Cabeças no rebanho</div><div class="v">${num(totalCabecas())}</div></div>
    <div class="card"><div class="k">Valor do rebanho</div><div class="v">${brl(valorRebanho())}</div></div>
    <div class="card"><div class="k">Receitas</div><div class="v pos">${brl(rec)}</div></div>
    <div class="card"><div class="k">Despesas</div><div class="v neg">${brl(desp)}</div></div>
    <div class="card"><div class="k">Investido em benfeitorias</div><div class="v">${brl(obras)}</div></div>
    <div class="card"><div class="k">Saldo (receitas − despesas − benfeitorias)</div><div class="v ${saldo>=0?'pos':'neg'}">${brl(saldo)}</div></div>
  </div>
  <div class="card"><h2>Rebanho por categoria</h2><div class="tw"><table>
    <tr><th>Categoria</th><th class="n">Cabeças</th><th class="n">Valor/cabeça</th><th class="n">Total</th></tr>${rows}
    <tr><td><b>Total</b></td><td class="n"><b>${num(totalCabecas())}</b></td><td></td><td class="n"><b>${brl(valorRebanho())}</b></td></tr>
  </table></div></div>
  <div class="card"><h2>Benfeitorias</h2>${S.obras.length?`<p>Orçado: <b>${brl(orcTotal())}</b> · Gasto: <b>${brl(totalObras())}</b> · Restante: <b class="${orcTotal()-totalObras()>=0?'pos':'neg'}">${brl(orcTotal()-totalObras())}</b></p>`:'<div class="empty">Nenhuma benfeitoria cadastrada.</div>'}</div>`;
}

/* ---------- REBANHO ---------- */
function vRebanho(){
  const opts=S.cats.map(c=>`<option value="${c.id}">${esc(c.nome)} (${num(c.qtd)})</option>`).join('');
  const rows=S.cats.map(c=>`<tr><td>${esc(c.nome)}</td><td class="n"><input style="width:90px;text-align:right" type="number" min="0" step="1" value="${c.qtd}" onchange="setQtd('${c.id}',this.value)"></td>
    <td class="n"><input style="width:110px;text-align:right" type="number" min="0" step="0.01" value="${c.valor}" onchange="setValor('${c.id}',this.value)"></td>
    <td class="n">${brl(c.qtd*c.valor)}</td>
    <td><button class="btn del sm" onclick="delCat('${c.id}')">Remover</button></td></tr>`).join('');
  const movs=[...S.movs].sort((a,b)=>b.data.localeCompare(a.data)||b.id.localeCompare(a.id)).map(m=>`<tr>
    <td>${dt(m.data)}</td><td><span class="tag ${m.tipo}">${m.tipo}</span></td><td>${esc(catNome(m.catId))}</td>
    <td class="n">${num(m.qtd)}</td><td class="n">${brl(m.valor)}</td><td class="n">${brl(m.qtd*m.valor)}</td><td>${esc(m.obs)}</td>
    <td><button class="btn del sm" onclick="delMov('${m.id}')">Desfazer</button></td></tr>`).join('');
  return `<div class="card"><h2>Registrar movimentação</h2>
    <p class="hint">Venda e morte descontam do rebanho. Compra e nascimento somam. Venda e compra também lançam automaticamente no financeiro.</p>
    <form onsubmit="addMov(event)">
      <label>Tipo<select name="tipo"><option value="venda">Venda (−)</option><option value="compra">Compra (+)</option><option value="nascimento">Nascimento (+)</option><option value="morte">Morte (−)</option></select></label>
      <label>Categoria<select name="cat">${opts}</select></label>
      <label>Nº de cabeças<input name="qtd" type="number" min="1" step="1" required></label>
      <label>Valor por cabeça (R$)<input name="valor" type="number" min="0" step="0.01" value="0"></label>
      <label>Data<input name="data" type="date" value="${hoje()}" required></label>
      <label>Observação (comprador, lote...)<input name="obs"></label>
      <button class="btn">Registrar</button>
    </form><div class="err" id="errMov"></div></div>
  <div class="card"><h2>Rebanho atual</h2><p class="hint">Já tem gado? Digite direto o número de cabeças e o valor médio de cada categoria. Salva sozinho.</p><div class="tw"><table>
    <tr><th>Categoria</th><th class="n">Cabeças</th><th class="n">Valor médio/cabeça</th><th class="n">Total</th><th></th></tr>${rows||''}
    <tr><td><b>Total</b></td><td class="n"><b>${num(totalCabecas())}</b></td><td></td><td class="n"><b>${brl(valorRebanho())}</b></td><td></td></tr></table></div>
    <form style="margin-top:12px" onsubmit="addCat(event)">
      <label>Nova categoria<input name="nome" required placeholder="ex: Garrotes"></label>
      <label>Cabeças iniciais<input name="qtd" type="number" min="0" step="1" value="0"></label>
      <label>Valor/cabeça (R$)<input name="valor" type="number" min="0" step="0.01" value="0"></label>
      <button class="btn sec">Adicionar categoria</button>
    </form></div>
  <div class="card"><h2>Histórico de movimentações</h2><div class="tw">${S.movs.length?`<table>
    <tr><th>Data</th><th>Tipo</th><th>Categoria</th><th class="n">Cabeças</th><th class="n">Valor/cab.</th><th class="n">Total</th><th>Obs.</th><th></th></tr>${movs}</table>`:'<div class="empty">Nenhuma movimentação ainda.</div>'}</div></div>`;
}
function addCat(e){e.preventDefault();const f=new FormData(e.target);
  S.cats.push({id:uid(),nome:f.get('nome').trim(),qtd:Math.floor(+f.get('qtd'))||0,valor:+f.get('valor')||0});commit()}
function setQtd(id,v){S.cats.find(c=>c.id===id).qtd=Math.max(0,Math.floor(+v)||0);commit()}
function setValor(id,v){S.cats.find(c=>c.id===id).valor=Math.max(0,+v||0);commit()}
async function delCat(id){const c=S.cats.find(x=>x.id===id);
  if(S.movs.some(m=>m.catId===id)){await say('Esta categoria tem movimentações. Desfaça-as antes de remover.');return}
  if(await ask(`Remover "${c.nome}"?`)){S.cats=S.cats.filter(x=>x.id!==id);commit()}}
const SINAL={venda:-1,morte:-1,compra:1,nascimento:1};
function addMov(e){e.preventDefault();const f=new FormData(e.target);
  const tipo=f.get('tipo'),catId=f.get('cat'),qtd=Math.floor(+f.get('qtd')),valor=+f.get('valor')||0,data=f.get('data'),obs=f.get('obs').trim();
  const c=S.cats.find(x=>x.id===catId);
  if(!c||!(qtd>0))return;
  if(SINAL[tipo]<0&&qtd>c.qtd){$('#errMov').textContent=`Você só tem ${c.qtd} cabeça(s) em "${c.nome}".`;return}
  const m={id:uid(),data,tipo,catId,qtd,valor,obs};
  c.qtd+=SINAL[tipo]*qtd;
  if(tipo==='compra'&&valor>0){
    const antes=c.qtd-qtd;c.valor=((antes*c.valor)+(qtd*valor))/c.qtd; // valor médio ponderado
  }
  if((tipo==='venda'||tipo==='compra')&&valor>0){
    S.lancs.push({id:uid(),data,tipo:tipo==='venda'?'receita':'despesa',cat:tipo==='venda'?'Venda de gado':'Compra de gado',desc:`${tipo==='venda'?'Venda':'Compra'} de ${qtd} ${c.nome}${obs?' – '+obs:''}`,valor:qtd*valor,movId:m.id});
  }
  S.movs.push(m);commit()}
async function delMov(id){const m=S.movs.find(x=>x.id===id),c=S.cats.find(x=>x.id===m.catId);
  if(!c){await say('Categoria não existe mais.');return}
  if(c.qtd-SINAL[m.tipo]*m.qtd<0){await say('Não é possível desfazer: o rebanho ficaria negativo.');return}
  if(!await ask('Desfazer esta movimentação? O rebanho e o lançamento financeiro serão revertidos.'))return;
  c.qtd-=SINAL[m.tipo]*m.qtd;
  S.lancs=S.lancs.filter(l=>l.movId!==id);S.movs=S.movs.filter(x=>x.id!==id);commit()}

/* ---------- FINANCEIRO ---------- */
function vFin(){
  const rec=somaLanc('receita'),desp=somaLanc('despesa');
  const rows=[...S.lancs].sort((a,b)=>b.data.localeCompare(a.data)||b.id.localeCompare(a.id)).map(l=>`<tr>
    <td>${dt(l.data)}</td><td><span class="tag ${l.tipo}">${l.tipo}</span></td><td>${esc(l.cat)}</td><td>${esc(l.desc)}</td>
    <td class="n ${l.tipo==='receita'?'pos':'neg'}">${l.tipo==='receita'?'':'−'}${brl(l.valor)}</td>
    <td>${l.movId?'<span class="hint">via rebanho</span>':`<button class="btn del sm" onclick="delLanc('${l.id}')">Excluir</button>`}</td></tr>`).join('');
  return `<div class="grid">
    <div class="card"><div class="k">Receitas</div><div class="v pos">${brl(rec)}</div></div>
    <div class="card"><div class="k">Despesas</div><div class="v neg">${brl(desp)}</div></div>
    <div class="card"><div class="k">Resultado</div><div class="v ${rec-desp>=0?'pos':'neg'}">${brl(rec-desp)}</div></div></div>
  <div class="card"><h2>Novo lançamento</h2>
    <form onsubmit="addLanc(event)">
      <label>Tipo<select name="tipo" onchange="trocaCats(this)"><option value="despesa">Despesa</option><option value="receita">Receita</option></select></label>
      <label>Categoria<select name="cat" id="selCat">${CATS_DESP.map(c=>`<option>${c}</option>`).join('')}</select></label>
      <label>Descrição<input name="desc" required></label>
      <label>Valor (R$)<input name="valor" type="number" min="0.01" step="0.01" required></label>
      <label>Data<input name="data" type="date" value="${hoje()}" required></label>
      <button class="btn">Lançar</button></form></div>
  <div class="card"><h2>Lançamentos</h2><div class="tw">${S.lancs.length?`<table><tr><th>Data</th><th>Tipo</th><th>Categoria</th><th>Descrição</th><th class="n">Valor</th><th></th></tr>${rows}</table>`:'<div class="empty">Nenhum lançamento.</div>'}</div>
    <p class="hint">Custos de benfeitorias ficam na aba Benfeitorias e entram no saldo do Resumo.</p></div>`;
}
function trocaCats(sel){$('#selCat').innerHTML=(sel.value==='receita'?CATS_REC:CATS_DESP).map(c=>`<option>${c}</option>`).join('')}
function addLanc(e){e.preventDefault();const f=new FormData(e.target);
  S.lancs.push({id:uid(),data:f.get('data'),tipo:f.get('tipo'),cat:f.get('cat'),desc:f.get('desc').trim(),valor:+f.get('valor')});commit()}
async function delLanc(id){if(await ask('Excluir lançamento?')){S.lancs=S.lancs.filter(l=>l.id!==id);commit()}}

/* ---------- BENFEITORIAS ---------- */
const STATUS=['Planejada','Em andamento','Concluída'];
function vObras(){
  const obras=S.obras.map(o=>{
    const g=gastoObra(o.id),pct=o.orcamento>0?g/o.orcamento*100:0,rest=o.orcamento-g;
    const cs=S.custos.filter(c=>c.obraId===o.id).sort((a,b)=>b.data.localeCompare(a.data));
    const aberto=filtroObra===o.id;
    return `<div class="obra">
      <div class="obra-h"><div><b>${esc(o.nome)}</b> <span class="tag">${o.status}</span></div>
        <div class="row"><select onchange="setStatus('${o.id}',this.value)">${STATUS.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select>
        <button class="btn sec sm" onclick="filtroObra=${aberto?'null':`'${o.id}'`};render()">${aberto?'Fechar':'Custos'}</button>
        <button class="btn del sm" onclick="delObra('${o.id}')">Excluir</button></div></div>
      <div class="row" style="margin-top:8px"><span>Orçado: <b>${brl(o.orcamento)}</b></span><span>Gasto: <b>${brl(g)}</b></span>
        <span>${rest>=0?'Saldo':'Estourou'}: <b class="${rest>=0?'pos':'neg'}">${brl(Math.abs(rest))}</b></span><span class="hint">${pct.toFixed(0)}%</span></div>
      <div class="bar"><i class="${pct>100?'over':''}" style="width:${Math.min(100,pct)}%"></i></div>
      ${o.obs?`<p class="hint" style="margin-top:8px">${esc(o.obs)}</p>`:''}
      ${aberto?`<form style="margin-top:12px" onsubmit="addCusto(event,'${o.id}')">
        <label>Descrição<input name="desc" required placeholder="ex: Arame, mão de obra..."></label>
        <label>Fornecedor<input name="forn"></label>
        <label>Valor (R$)<input name="valor" type="number" min="0.01" step="0.01" required></label>
        <label>Data<input name="data" type="date" value="${hoje()}" required></label>
        <button class="btn">Adicionar custo</button></form>
        <div class="tw" style="margin-top:8px">${cs.length?`<table><tr><th>Data</th><th>Descrição</th><th>Fornecedor</th><th class="n">Valor</th><th></th></tr>${cs.map(c=>`<tr><td>${dt(c.data)}</td><td>${esc(c.desc)}</td><td>${esc(c.forn)}</td><td class="n">${brl(c.valor)}</td><td><button class="btn del sm" onclick="delCusto('${c.id}')">Excluir</button></td></tr>`).join('')}</table>`:'<div class="empty">Sem custos lançados.</div>'}</div>`:''}
    </div>`}).join('');
  return `<div class="grid">
    <div class="card"><div class="k">Orçamento total</div><div class="v">${brl(orcTotal())}</div></div>
    <div class="card"><div class="k">Total gasto</div><div class="v">${brl(totalObras())}</div></div>
    <div class="card"><div class="k">Saldo do orçamento</div><div class="v ${orcTotal()-totalObras()>=0?'pos':'neg'}">${brl(orcTotal()-totalObras())}</div></div></div>
  <div class="card"><h2>Nova benfeitoria</h2>
    <form onsubmit="addObra(event)">
      <label>Nome<input name="nome" required placeholder="ex: Cercas, Curral, Poço, Casa sede"></label>
      <label>Orçamento (R$)<input name="orc" type="number" min="0" step="0.01" value="0"></label>
      <label>Situação<select name="status">${STATUS.map(s=>`<option>${s}</option>`).join('')}</select></label>
      <label>Observação<input name="obs"></label>
      <button class="btn">Cadastrar</button></form></div>
  ${obras||'<div class="card empty">Cadastre as benfeitorias (cercas, curral, aguadas, pastagem, casa...) e lance os custos de cada uma.</div>'}`;
}
function addObra(e){e.preventDefault();const f=new FormData(e.target);
  S.obras.push({id:uid(),nome:f.get('nome').trim(),orcamento:+f.get('orc')||0,status:f.get('status'),obs:f.get('obs').trim()});commit()}
function setStatus(id,v){S.obras.find(o=>o.id===id).status=v;commit()}
async function delObra(id){if(await ask('Excluir benfeitoria e todos os seus custos?')){S.obras=S.obras.filter(o=>o.id!==id);S.custos=S.custos.filter(c=>c.obraId!==id);commit()}}
function addCusto(e,obraId){e.preventDefault();const f=new FormData(e.target);
  S.custos.push({id:uid(),obraId,data:f.get('data'),desc:f.get('desc').trim(),forn:f.get('forn').trim(),valor:+f.get('valor')});commit()}
async function delCusto(id){if(await ask('Excluir custo?')){S.custos=S.custos.filter(c=>c.id!==id);commit()}}

/* ---------- backup ---------- */
async function exportar(){
  try{const d=window.claude&&await window.claude.use('downloads');
    if(d){await d.save({filename:`fazenda-backup-${hoje()}.json`,data:JSON.stringify(S,null,1)});return}}catch(e){return}
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));
  a.download=`fazenda-backup-${hoje()}.json`;a.click()}
function importar(e){const r=new FileReader();r.onload=async()=>{try{const d=JSON.parse(r.result);
  if(!d.cats)throw 0;if(await ask('Substituir todos os dados atuais pelo backup?')){S=d;commit()}}catch(_){await say('Arquivo inválido.')}};
  r.readAsText(e.target.files[0]);e.target.value=''}

render();
initDb();
</script>
</body>
